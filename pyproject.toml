[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-tetris"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",   # needed by both
]

[project.optional-dependencies]
client = [
    "httpx",
    "windows-curses; sys_platform == 'win32'",
]
server = [
    "fastapi",
    "uvicorn[standard]",
    "argon2-cffi",
    "pyjwt",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest"
]

[tool.setuptools.packages.find]
include = [
    "client*",
    "game*",
    "net*",
    "render*",
    "server*",
    "shared*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pyright]
include = [
    "client",
    "game",
    "net",
    "render",
    "server",
    "shared"
]
exclude = [
    "**/__pycache__"
]
typeCheckingMode = "basic"
