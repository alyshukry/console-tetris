services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tetris
      POSTGRES_PASSWORD: tetris
      POSTGRES_DB: tetris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetris -d tetris"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    environment:
      - DATABASE_URL=postgresql+psycopg://tetris:tetris@db:5432/tetris
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: