services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tetris
      POSTGRES_PASSWORD: tetris
      POSTGRES_DB: tetris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetris -d tetris"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    command: fastapi dev server/main.py --host 0.0.0.0 --port 8000
    restart: "no"
    environment:
      - DATABASE_URL=postgresql+psycopg://tetris:tetris@db:5432/tetris
    volumes:
      - ./server:/app/server
      - ./game:/app/game
      - ./net:/app/net
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: